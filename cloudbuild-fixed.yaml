# Enhanced Cloud Build configuration for B4uSign with health check fixes
steps:
  # Install dependencies
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci']
    
  # Build the application
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']
    
  # Deploy to Cloud Run with health check optimizations
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: 
      - 'run'
      - 'deploy'
      - 'b4usign-warranty-marketplace'
      - '--source=.'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=300'
      - '--concurrency=80'
      - '--set-env-vars=NODE_ENV=production'
      - '--set-env-vars=HOST=0.0.0.0'
      - '--execution-environment=gen2'
      - '--cpu-boost'
      - '--startup-cpu-boost'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  
substitutions:
  _SERVICE_NAME: 'b4usign-warranty-marketplace'
  _REGION: 'us-central1'
  
timeout: '600s'